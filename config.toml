# Harness configuration. Paths may use ~.

[local]
# OpenAI-compatible chat endpoint of the on-box model (llama.cpp, vLLM, Ollama, LM Studio...).
base_url = "http://localhost:8000/v1"
model = "abliterated"
api_key = "none"
timeout = 900
max_partition_tries = 4
max_impl_tries = 4

[frontier]
backend = "claude"            # claude | codex | fake
claude_model = ""             # blank = CLI default
claude_extra_args = ["--dangerously-skip-permissions"]  # it runs confined to the public dir
codex_model = ""
codex_extra_args = ["--full-auto"]
timeout = 3600

[detector]
# Jev (TypeSafe) via the OpenRouter Decisions API. Scores each span of the
# candidate public view for policy violations. Everything scored is sent to
# OpenRouter; the harness never sends the raw prompt or private notes here.
enabled = true
base_url = "https://openrouter.ai/api/alpha/decisions"
model = "typesafe/jev-1.14"
api_key_env = "OPENROUTER_API_KEY"
threshold = 0.5
timeout = 60
# Pre-score the RAW PROMPT span by span and give the local model the leak map,
# and let it ask for extra probes on subsets. This sends raw prompt text to
# OpenRouter/TypeSafe. Turn off if you only trust the box.
probe_raw_prompt = true
max_probe_rounds = 3
policy = """unreleased product names and internal project codenames; customer or partner identities; \
proprietary algorithms, formulas, weights, thresholds or heuristics; internal hostnames, \
paths, schemas or infrastructure details; credentials; anything export-controlled; \
business metrics, pricing or contract terms."""

[paths]
workspace = "./workspace"          # public builds live here, one dir per run
private_root = "~/harness-private"  # prompts, contracts, private impls, denylist
