[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "killchain"
version = "0.1.3"
description = "Split a build so a frontier coding agent never sees the risky half."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Simmons" }]
keywords = ["agents", "claude-code", "codex", "partitioning", "codegen"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
# Deliberately empty: killchain runs on the standard library alone. Shipping
# zero dependencies is the reason `uvx killchain` is a clean one-liner.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
killchain = "killchain.harness:main"

[project.urls]
Homepage = "https://github.com/jcpsimmons/killchain"
Repository = "https://github.com/jcpsimmons/killchain"
Issues = "https://github.com/jcpsimmons/killchain/issues"
YouTube = "https://youtube.com/@drjoshcsimmons"

# `packages` already sweeps in prompts/ and config.toml; force-include would
# add them a second time and hatchling rejects the duplicate.
[tool.hatch.build.targets.wheel]
packages = ["killchain"]

[tool.hatch.build.targets.sdist]
# Keep the release artefact to the package. An explicit list rather than a
# deny-list: a git worktree checked out inside the repo is a second full copy
# of the package, and hatchling's VCS sweep ships it (the sdist went to 41
# entries against a clean 22 when one existed). CI builds from a clean clone so
# this only bites local releases, which is the worst way to find out.
include = ["killchain", "README.md", "EVALS.md", "pyproject.toml"]
# The landing page is its own build (site/, Astro, deployed separately).
exclude = ["/site"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness and real bugs only. Style preferences are deliberately out of
# scope: this is a small stdlib-only tool and the import-alias and regex-alias
# opinions cost more churn than they save.
select = ["F", "E4", "E7", "E9", "W6", "I", "UP032", "B006", "B008"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
