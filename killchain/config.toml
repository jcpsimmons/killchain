# killchain configuration. Paths may use ~.
#
# This file is the shipped default. On first run it is copied to
# ~/.config/killchain/config.toml, which is what you should edit.

[orchestrator]
# The abliterated orchestrator model: the only model that sees the full prompt.
# Any OpenAI-compatible chat endpoint. Default: refuseless, settings mirrored
# from ~/.hermes/config.yaml. The key is read from $REFUSELESS_API_KEY, or
# from env_file if that is unset. It is never written to disk by killchain.
base_url = "https://api.refuseless.com/v1"
model = "deepseek-v4.1-flash-abliterated"   # also: glm-5.3-abliterated, glm-5.3-flash-abliterated
api_key_env = "REFUSELESS_API_KEY"
env_file = "~/.hermes/.env"
timeout = 900
max_partition_tries = 4
max_impl_tries = 4

[frontier]
backend = "claude"            # claude | codex | fake
claude_model = ""             # blank = CLI default
claude_extra_args = ["--dangerously-skip-permissions"]  # it runs confined to the public dir
codex_model = ""
codex_extra_args = ["--full-auto"]
timeout = 3600

[risk]
# Jev (TypeSafe) via the OpenRouter Decisions API. Scores each span of the
# candidate public view on every refusal dimension in routing.py. Everything
# scored is sent to OpenRouter, so scoring happens on the public view and, if
# score_raw_prompt is on, on spans of the raw prompt.
enabled = true
base_url = "https://openrouter.ai/api/alpha/decisions"
model = "typesafe/jev-1.14"
api_key_env = "OPENROUTER_API_KEY"
# Dimensions, thresholds and the per-span decision live in routing.py.
timeout = 60
# Pre-score the RAW PROMPT span by span to build the risk map, and let the
# orchestrator ask for extra probes on subsets. Refusal risk is carried by the
# original phrasing, so this is the useful mode. All of it goes to
# OpenRouter/TypeSafe; turn off to score only the assembled public view.
probe_raw_prompt = true
max_probe_rounds = 3

[routing]
# Shipped defaults live in killchain/routing.py; anything set here wins. Read
# routing.py first - these change what the frontier model is allowed to build.
# Nothing here is required; the section exists so retuning needs no code edit.

# Drop a dimension entirely (it stops being asked and stops routing spans).
# disabled_dimensions = ["hedge_framing"]

# Per-dimension bar, 0..1: the risk probability needed to pull a span out of
# the public view. Lower = more paranoid (more goes private).
# Valid keys: attribution, reverse_engineering, offensive_security, extraction,
#             regulated, proprietary_model, hedge_framing, scale_or_scope,
#             overall, default
# [routing.thresholds]
# hedge_framing = 0.75
# attribution = 0.40

# Adjustment per span kind, added to the bar. Fixtures are bare JSON numbers
# and score near 0.5 whatever they contain, so they get a higher bar.
# [routing.kind_slack]
# fixture = 0.15

# Extra regexes that block an outbound view outright, no model involved.
# Prefix with re: for a regex, otherwise it is a literal. Prefer the denylist
# file for terms; use this for patterns that should ship with your team's config.
# hard_rules = ["TICKER-[A-Z]{4}", { pattern = "re:\\bsk-[a-z0-9]{20,}", why = "looks like an API key" }]

[paths]
# Defaults are user directories so an installed command never writes into
# site-packages. Override with env vars (KILLCHAIN_PRIVATE_ROOT) or per run
# with --workspace / --private-root. Relative paths resolve against the cwd.
workspace = ""                    # blank = <project>/.killchain/workspace, else ~/.local/share/killchain/workspace
private_root = "~/killchain-private"   # mode 0700: prompts, contracts, private impls
denylist = ""                     # blank = ~/.config/killchain/denylist.txt
