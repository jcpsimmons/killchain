name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests gate the publish. A green release button is not evidence the wheel
  # works, and a bad version on PyPI cannot be reused later.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check killchain tests
      - name: Test
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      # Install the built wheel into a clean venv and run the CLI from it.
      # This is the step that catches packaging mistakes the source tree
      # hides: missing data files, a broken entry point, a missing prompt.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/kc-smoke
          /tmp/kc-smoke/bin/pip install --quiet dist/*.whl
          /tmp/kc-smoke/bin/killchain --version
          /tmp/kc-smoke/bin/killchain --help > /dev/null
          export HOME=/tmp/kc-smoke-home
          mkdir -p "$HOME"
          /tmp/kc-smoke/bin/killchain --doctor || true
          /tmp/kc-smoke/bin/killchain "Write a function that adds two integers." \
            --frontier fake --orch-url fake --no-detector --yes
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
